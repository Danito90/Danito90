<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Daniel Torres. Software, automatización y datos.">
<title>Daniel Torres — Gerente Transversal de TI</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05100c"/>
    <stop offset="1" stop-color="#0a1620"/>
  </linearGradient>
  <radialGradient id="glowA" cx="0.18" cy="0.2" r="0.55">
    <stop offset="0" stop-color="#10b981" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="0.85" cy="0.9" r="0.5">
    <stop offset="0" stop-color="#06b6d4" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6ee7b7"/>
    <stop offset="0.5" stop-color="#34d399"/>
    <stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#34d399"/>
    <stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1.5" cy="1.5" r="1.2" fill="#9ff5d0" fill-opacity="0.08"/>
  </pattern>
  <clipPath id="frame"><rect width="1280" height="320" rx="20"/></clipPath>
  <style>
    .mono { font-family: 'JetBrains Mono','Cascadia Code',Consolas,'SFMono-Regular',Menlo,monospace; }
    .sans { font-family: 'Segoe UI','Inter',system-ui,-apple-system,Arial,sans-serif; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .scan { animation: scan 6s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(360px); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .cursor, .scan, .pulse { animation: none; } }
  </style>
</defs>

<g clip-path="url(#frame)">
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <rect width="1280" height="320" fill="url(#glowA)"/>
  <rect width="1280" height="320" fill="url(#glowB)"/>
  <rect class="scan" x="0" y="0" width="1280" height="2" fill="#34d399" fill-opacity="0.10"/>
  <rect x="0" y="316" width="1280" height="4" fill="url(#edge)"/>
</g>
<rect x="0.5" y="0.5" width="1279" height="319" rx="20" fill="none" stroke="#34d399" stroke-opacity="0.18"/>

<!-- Columna izquierda -->
<g class="mono" font-size="17">
  <text x="64" y="74" fill="#34d399">~/danito90<tspan fill="#64748b"> $ </tspan><tspan fill="#e2e8f0">whoami </tspan><tspan class="cursor" fill="#34d399">▋</tspan></text>
</g>
<text class="sans" x="60" y="156" font-size="72" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Daniel Torres</text>
<text class="mono" x="64" y="204" font-size="22" fill="#cbd5e1">software <tspan fill="#34d399">·</tspan> automatización <tspan fill="#34d399">·</tspan> datos</text>

<g class="mono" font-size="14">
  <rect x="64" y="236" width="248" height="34" rx="17" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.35"/>
  <circle class="pulse" cx="86" cy="253" r="5" fill="#34d399"/>
  <text x="100" y="258" fill="#a7f3d0">Gerente Transversal de TI</text>
  <rect x="326" y="236" width="194" height="34" rx="17" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.35"/>
  <path d="M348 245.5a5.5 5.5 0 0 1 5.5 5.5c0 4-5.5 9.5-5.5 9.5s-5.5-5.5-5.5-9.5a5.5 5.5 0 0 1 5.5-5.5z" fill="#22d3ee"/>
  <circle cx="348" cy="251" r="2" fill="#0a1620"/>
  <text x="362" y="258" fill="#a5f3fc">Mendoza, Argentina</text>
</g>

<!-- Tarjeta de código -->
<g transform="translate(760 52)">
  <rect width="456" height="216" rx="14" fill="#0b1416" fill-opacity="0.85" stroke="#1f3a33"/>
  <path d="M0 14a14 14 0 0 1 14-14h428a14 14 0 0 1 14 14v22H0z" fill="#0f1d1c"/>
  <circle cx="22" cy="18" r="5.5" fill="#f87171"/>
  <circle cx="40" cy="18" r="5.5" fill="#fbbf24"/>
  <circle cx="58" cy="18" r="5.5" fill="#34d399"/>
  <text class="mono" x="228" y="23" font-size="12" fill="#64748b" text-anchor="middle">perfil.ts</text>
  <g class="mono" font-size="15">
    <text x="22" y="68"><tspan fill="#c084fc">const</tspan><tspan fill="#e2e8f0"> daniel = {</tspan></text>
    <text x="42" y="96"><tspan fill="#7dd3fc">rol</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#86efac">"IT · Full Stack"</tspan><tspan fill="#94a3b8">,</tspan></text>
    <text x="42" y="124"><tspan fill="#7dd3fc">stack</tspan><tspan fill="#94a3b8">: [</tspan><tspan fill="#86efac">"Next.js"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"Python"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"SQL"</tspan><tspan fill="#94a3b8">],</tspan></text>
    <text x="42" y="152"><tspan fill="#7dd3fc">datos</tspan><tspan fill="#94a3b8">: [</tspan><tspan fill="#86efac">"Power BI"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"n8n"</tspan><tspan fill="#94a3b8">],</tspan></text>
    <text x="42" y="180"><tspan fill="#7dd3fc">ia</tspan><tspan fill="#94a3b8">: [</tspan><tspan fill="#86efac">"agentes"</tspan><tspan fill="#94a3b8">, </tspan><tspan fill="#86efac">"LLMs"</tspan><tspan fill="#94a3b8">],</tspan></text>
    <text x="22" y="204" fill="#e2e8f0">};</text>
  </g>
</g>
</svg>
